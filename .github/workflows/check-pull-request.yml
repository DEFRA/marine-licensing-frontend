name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - feature/**
      - ML-*
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  # Allows manual execution on a Dependabot PR branch to validate the lockfile normalisation job
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Format and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

  unit-tests:
    name: Unit Tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npm run test:ci:shard -- ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Vitest blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: vitest-blob-${{ matrix.shardIndex }}
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1

  merge-test-reports:
    name: Merge Test Reports
    needs: unit-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Vitest blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4.3.0
        with:
          path: .vitest-reports
          pattern: vitest-blob-*
          merge-multiple: true

      - name: Merge reports and coverage
        run: npm run test:ci:merge

      - name: Upload coverage
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: coverage
          path: coverage
          retention-days: 1

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: |
          # Temporary braces allowlist in .audit-ci.jsonc — revisit/remove by this date
          EXPIRES_ON=2026-10-12
          TODAY=$(date -u +%F)
          if ! [[ "$TODAY" < "$EXPIRES_ON" ]]; then
            echo "::error::Temporary npm audit allowlist for GHSA-vfj7-8cjw-p6xm expired on ${EXPIRES_ON}. Revisit braces or extend the date with team agreement."
            exit 1
          fi
          npm run audit

  docker:
    name: Test Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-frontend-template .
          exit $?

  sonar:
    name: SonarCloud Scan
    needs: merge-test-reports
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4.3.0
        with:
          name: coverage
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 #v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Aggregator so existing branch-protection required checks keep working
  pr-validator:
    name: Run Pull Request Checks
    needs:
      - quality
      - merge-test-reports
      - security-audit
      - docker
      - sonar
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check dependent jobs
        run: |
          fail=0
          check_success() {
            local name="$1"
            local result="$2"
            echo "$name: $result"
            if [[ "$result" != "success" ]]; then
              fail=1
            fi
          }

          check_success quality "${{ needs.quality.result }}"
          check_success merge-test-reports "${{ needs.merge-test-reports.result }}"
          check_success security-audit "${{ needs.security-audit.result }}"
          check_success docker "${{ needs.docker.result }}"

          sonar_result="${{ needs.sonar.result }}"
          echo "sonar: $sonar_result"
          if [[ "$sonar_result" == "success" ]]; then
            true
          elif [[ "$sonar_result" == "skipped" && "${{ github.actor }}" == "dependabot[bot]" ]]; then
            true
          else
            fail=1
          fi

          if [[ "$fail" -ne 0 ]]; then
            echo "One or more required jobs did not succeed"
            exit 1
          fi
          echo "All required jobs succeeded"

  test-journey:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
      - name: Select journey test profile
        id: journey-profile
        run: |
          set_profile() {
            echo "profile=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
          }

          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            set_profile smoke "Dependabot PR detected — running smoke journey tests only"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            set_profile github "Running full github journey test suite"
            exit 0
          fi

          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "Changed files:"
          printf '%s\n' "$changed"

          if [ -z "$changed" ]; then
            set_profile github "No changed files detected — running full github journey test suite"
            exit 0
          fi

          non_smoke_ci=$(printf '%s\n' "$changed" | grep -vE '^(package\.json|package-lock\.json|\.github/.*\.(yml|yaml))$' || true)
          if [ -z "$non_smoke_ci" ]; then
            set_profile smoke "Only dependency lockfile and/or GitHub workflow YAML changed — running smoke journey tests only"
            exit 0
          fi

          touches_exemption=false
          touches_lcml=false
          touches_iat=false
          touches_other=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              package.json|package-lock.json|.github/*.yml|.github/*.yaml|.github/*/*.yml|.github/*/*.yaml)
                ;;
              src/server/exemption/*|src/services/exemption-service/*|src/server/internal-user-admin/exemptions/*)
                touches_exemption=true
                ;;
              src/server/marine-licence/*|src/services/marine-licence-service/*)
                touches_lcml=true
                ;;
              src/services/iat-service/*|src/client/javascripts/iat-answer-print/*|src/client/stylesheets/components/iat-option/*|src/server/journey/*)
                touches_iat=true
                ;;
              *)
                touches_other=true
                ;;
            esac
          done <<EOF
          $changed
          EOF

          if [ "$touches_other" = true ]; then
            set_profile github "Shared or non-area changes detected — running full github journey test suite"
          elif [ "$touches_exemption" = true ] && [ "$touches_lcml" = false ] && [ "$touches_iat" = false ]; then
            set_profile exemption "Exemption-only changes — running exemption journey tests"
          elif [ "$touches_lcml" = true ] && [ "$touches_exemption" = false ] && [ "$touches_iat" = false ]; then
            set_profile lcml "LCML-only changes — running lcml journey tests (+ smoke)"
          elif [ "$touches_iat" = true ] && [ "$touches_exemption" = false ] && [ "$touches_lcml" = false ]; then
            set_profile iat "IAT-only changes — running iat journey tests (+ smoke)"
          else
            set_profile github "Multi-area or unmatched changes — running full github journey test suite"
          fi
      - run: docker build -t defradigital/marine-licensing-frontend:${{github.sha}} .
      - uses: DEFRA/marine-licensing-journey-tests/run-journey-tests@main
        with:
          marine-licensing-frontend: ${{github.sha}}
          branch: main
          profile: ${{ steps.journey-profile.outputs.profile }}
